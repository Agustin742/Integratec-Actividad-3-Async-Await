<!DOCTYPE html>
<html lang=en >
<head>
    <meta charset="UTF-8">
    <title>User search</title>
</head>
    <body>
        <section>
            <h1>User search</h1>
            <input id="timeInput" type="number" placeholder= "number of wait seconds" >
            <button id="searchButton">Search</button>
            <p id="waitMessage"></p>
            <ul id="userList"></ul>
        </section>

        <section>
            <h2>Posts</h2>
            <button id="getPostsBtn">Get Posts</button>
            <ul id="postsList"></ul>
        </section>

        <section>
            <h2>Users and Posts</h2>
            <button id="getUsersAndPostsBtn">Get Users and Posts</button>
            <ul id="usersAndPostsList"></ul>
        </section>

        <section>
            <h2>Create Post</h2>
            <form id="createPostForm">
                <input type="text" id="postTitle" placeholder="Post Title" name="title" required>
                <textarea id="postBody" placeholder="Post Body" name="body" required></textarea>
                <button type="submit">Create Post</button>
            </form>
            <aside>
                <h3>Created Post:</h3>
                <p id="createdPostTitle"></p>
                <p id="createdPostBody"></p>
            </aside>
        </section>

        <script src="app.js"></script>
    </body>
</html>
